<div class="container">

  <h1>{{ title }}</h1>

  <input
    type="text"
    placeholder="Search for movies..."
    [(ngModel)]="searchText"
  >

  <button (click)="searchMovie()">
    Search
  </button>

  <div class="movies-container">

    <div class="movie-card" *ngFor="let movie of movies">

      <h2>{{ movie.title }}</h2>

      <p>⭐ {{ movie.vote_average }}</p>

      <img
        [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
        [alt]="movie.title"
      >

    </div>

  </div>

</div>
